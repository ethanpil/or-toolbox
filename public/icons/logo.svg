<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ORtoolbox">
  <!-- Original mark: a toolbox on the primary colour. Source for every PNG icon
       (npm run icons). -->
  <rect width="512" height="512" rx="112" fill="#4f46e5"/>
  <g id="mark">
    <!-- handle -->
    <path d="M194 180v-22a34 34 0 0 1 34-34h56a34 34 0 0 1 34 34v22" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- box -->
    <rect x="92" y="180" width="328" height="212" rx="36" fill="#fff"/>
    <!-- seam between lid and body -->
    <rect x="92" y="262" width="328" height="22" fill="#4f46e5"/>
    <!-- latch -->
    <rect x="226" y="240" width="60" height="66" rx="14" fill="#fff" stroke="#4f46e5" stroke-width="16"/>
  </g>
</svg>
