# Weekly update proposals. Actions are pinned to commit SHAs in the workflows;
# Dependabot updates the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for the routine minor and patch updates.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript stays on 6.x until typescript-eslint supports 7 (CLAUDE.md, "TypeScript 6, one compiler").
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
