name: CI

# One gated pipeline: check → e2e on every browser → deploy (main only).
# Repository settings → Pages → Source must be "GitHub Actions".
#
# Actions are pinned to full commit SHAs (the release in the comment);
# Dependabot (.github/dependabot.yml) proposes updates weekly. Checkouts keep
# no credentials. The install of the job whose build is deployed runs no
# package scripts: the only ones in the lockfile are @parcel/watcher (Sass's
# watch mode) and fsevents (macOS), both optional and unused by the build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main queue up, so a
  # deployment is never cut off half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts

      # Typecheck + lint + unit tests.
      - run: npm run check

      # A workbook written by our XLSX writer must open in a reader that shares none of its code: the app writes
      # a sample (src/core/export/xlsx-sample.ts) and openpyxl checks every value, type and format.
      - name: XLSX opens in openpyxl
        run: |
          XLSX_OUT="$RUNNER_TEMP/sample.xlsx" npx vitest run src/core/export/xlsx-sample.test.ts
          python3 -m pip install --quiet openpyxl
          python3 scripts/check-xlsx.py "$RUNNER_TEMP/sample.xlsx"

      # The build that is tested below is the build that is deployed.
      - run: npm run build

      # Shell at most 150 KB gzipped, each tool at most 80 KB more (CLAUDE.md, rule 8).
      - run: npm run budgets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          # dist/.nojekyll is a dotfile, which the action drops by default.
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Install ${{ matrix.browser }} for Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # The default suite (service workers blocked) and the service-worker
      # suite (isolation, offline shell, multi-threaded ffmpeg), against
      # `vite preview` of the build.
      - name: E2E
        run: npx playwright test --project=${{ matrix.browser }} --project=sw-${{ matrix.browser }}

      # Browser-only core modules (media, export) and shell states that need the page's core (tests/e2e/dev)
      # are exercised through the dev server, which serves /src.
      - name: E2E dev-server specs
        run: npx playwright test --config playwright.dev.config.ts tests/e2e/media tests/e2e/dev --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The site is built for /or-toolbox/ (BASE_PATH in the check job
      # overrides it). Refuse to deploy a build whose links would not work.
      - name: Check the base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$PAGES_BASE_PATH/" != "/or-toolbox/" ]; then
            echo "::error::Pages serves the site at '$PAGES_BASE_PATH/' but it was built for /or-toolbox/. Set BASE_PATH for the build."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
